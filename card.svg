<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 370" width="650" height="370">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f18" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF66" />
      <stop offset="40%" stop-color="#00E5FF" />
      <stop offset="80%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#00FF66" />
    </linearGradient>

    <!-- Chip Gradient -->
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F" />
      <stop offset="50%" stop-color="#FFC107" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="cyberGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00FF66" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .label { fill: #8b949e; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.2px; }
    .val { fill: #e6edf3; font-size: 13px; font-weight: 500; }
    .accent { fill: #00FF66; }
    .cyan { fill: #00E5FF; }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="646" height="366" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />
  <rect x="2" y="2" width="646" height="366" rx="16" fill="url(#cyberGrid)" />

  <!-- Inner Decorative Border -->
  <rect x="12" y="12" width="626" height="346" rx="10" fill="none" stroke="#00FF66" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="6,4" />

  <!-- Smart Card EMV Chip -->
  <g transform="translate(36, 36)">
    <rect width="44" height="34" rx="5" fill="url(#chipGrad)" stroke="#FF8F00" stroke-width="1" />
    <!-- Chip Contact Cuts -->
    <path d="M 0 17 L 16 17 M 28 17 L 44 17 M 16 0 L 16 34 M 28 0 L 28 34 M 16 9 L 28 9 M 16 25 L 28 25" stroke="#D39E00" stroke-width="1" fill="none" />
  </g>

  <!-- Contactless NFC waves symbol -->
  <g transform="translate(90, 42)" stroke="#00E5FF" stroke-width="1.8" fill="none" opacity="0.6">
    <path d="M 0 5 A 8 8 0 0 1 0 17" />
    <path d="M 5 2 A 13 13 0 0 1 5 20" />
    <path d="M 10 0 A 18 18 0 0 1 10 22" />
  </g>

  <!-- Top Right Status Badge -->
  <g transform="translate(470, 34)">
    <rect width="144" height="26" rx="13" fill="#00FF66" fill-opacity="0.1" stroke="#00FF66" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="16" cy="13" r="4" fill="#00FF66" filter="url(#glow)" />
    <text x="28" y="17" class="mono" fill="#00FF66" font-size="10" font-weight="700" letter-spacing="1">PGP VERIFIED</text>
  </g>

  <!-- Card Title / Holder Name -->
  <text x="36" y="105" class="sans" fill="#ffffff" font-size="22" font-weight="700" letter-spacing="0.5">SecH0us3</text>
  <text x="36" y="124" class="sans" fill="#00E5FF" font-size="12" font-weight="600" letter-spacing="0.8">CYBERSECURITY RESEARCHER &amp; SYSTEMS ARCHITECT</text>

  <!-- Divider Line -->
  <line x1="36" y1="140" x2="614" y2="140" stroke="#30363d" stroke-width="1" />

  <!-- Details Grid -->
  <!-- Row 1 -->
  <text x="36" y="165" class="label mono">SECURITY CONTACT</text>
  <text x="36" y="185" class="val mono cyan">public@secmy.app</text>

  <text x="360" y="165" class="label mono">KEY IDENTIFIER</text>
  <text x="360" y="185" class="val mono">68BA 1991 0575 1369</text>

  <!-- Row 2 -->
  <text x="36" y="215" class="label mono">ALGORITHM</text>
  <text x="36" y="235" class="val mono accent">ECC (Curve25519)</text>

  <text x="360" y="215" class="label mono">DISCLOSURE POLICY</text>
  <text x="360" y="235" class="val sans">Coordinated Vulnerability Disclosure (CVD)</text>

  <!-- Fingerprint Box -->
  <g transform="translate(36, 260)">
    <rect width="578" height="66" rx="8" fill="#04070d" stroke="#00FF66" stroke-width="1" stroke-opacity="0.3" />
    <text x="16" y="24" class="label mono" fill="#00FF66" font-size="10">PGP FINGERPRINT</text>
    <text x="16" y="47" class="mono" fill="#00FF66" font-size="13" font-weight="600" letter-spacing="1">B3A4 3B45 9703 F243 4D0E  CDA8 68BA 1991 0575 1369</text>
  </g>

  <!-- Bottom Security Watermark / Protocols -->
  <text x="40" y="348" class="mono" fill="#484f58" font-size="9" letter-spacing="1">RFC 4880 • RFC 9116 • OPENPGP WKD READY</text>
  <text x="614" y="348" class="mono" fill="#484f58" font-size="9" text-anchor="end" letter-spacing="1">SECH0US3.GPG</text>
</svg>